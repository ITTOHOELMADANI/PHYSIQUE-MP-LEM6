<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Documents de Physique-Chimie de la classe MP* – Lycée d'Excellence Mohammed VI, Casablanca – Pr E. ITTOHO">
<link rel="icon" href="img/logo-lycee.png">
<title>Physique-Chimie MP* – LEM6 Casablanca – Pr E. ITTOHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fira+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: navy class portal — fixed-width sidebar of navigation at left, folder listing at right; stacks to one column on phones. Deliberately dark (matches the reference portal). */
:root{
  --night:#040b1f;      /* page ground */
  --navy:#0b1d4a;       /* sidebar */
  --panel:#151c33;      /* folder header bar */
  --ink:#eef2fb;        /* main text */
  --mute:#9aa8c9;       /* secondary text */
  --link:#8fb0ff;       /* subject links */
  --rule:#2a3a66;       /* hairlines */
  --chalk:#f2c14e;      /* accent: chalk yellow, used sparingly */
  --font-display:"Fira Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--night)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;border-radius:3px}

.top{max-width:1240px;margin:0 auto;padding-block:22px 18px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;text-align:center}
.top h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.6rem,3.4vw,2.6rem);letter-spacing:.005em;margin:0;text-wrap:balance}
.top h1 em{font-style:normal;color:var(--chalk)}

.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}

/* sidebar */
.side{background:var(--navy);padding:18px 22px 22px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.side-icons{display:flex;justify-content:space-between;padding:0 6px 14px;border-bottom:1px solid var(--link)}
.side-icons button{width:38px;height:34px;display:grid;place-items:center;color:var(--link);border-radius:6px}
.side-icons button:hover,.side-icons button[aria-current="true"]{background:#ffffff14;color:var(--ink)}
.side-icons svg{width:21px;height:21px}
.logos{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;border-radius:6px;padding:8px 10px;margin:16px 0 4px}
.logos img{height:44px;width:auto;max-width:48%;object-fit:contain}
.sblock{padding:12px 0;border-bottom:1px solid var(--rule)}
.sblock:last-child{border-bottom:0}
.sblock h2{font-family:var(--font-display);font-weight:600;font-size:1.35rem;color:var(--link);margin:0 0 4px}
.slink{display:flex;align-items:center;gap:8px;padding:3px 0;color:var(--ink);width:100%;text-align:left}
.slink svg{width:18px;height:18px;flex:none;color:var(--mute)}
.slink:hover{color:var(--chalk)}
.slink.on{font-style:italic;color:var(--link)}
.meta{font-size:.88rem;color:var(--mute);margin:2px 0}
.meta b{color:var(--ink);font-weight:700}

/* main */
main{min-width:0}
.bar{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid #3a4568;border-radius:3px;padding:7px 12px;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--font-display);font-weight:600;font-size:1.12rem;min-width:0;flex:1}
.crumbs button{display:inline-flex;align-items:center;gap:7px;text-align:left}
.crumbs button:hover{color:var(--chalk)}
.crumbs .sep{color:var(--mute)}
.crumbs svg{width:19px;height:19px}
.sorts{display:flex;gap:4px}
.sorts button{width:32px;height:28px;display:grid;place-items:center;color:var(--mute);border-radius:4px}
.sorts button[aria-pressed="true"]{color:var(--ink);background:#ffffff1a}
.sorts svg{width:20px;height:20px}
.search{margin:14px 0 4px;display:flex}
.search input{flex:1;min-width:0;background:transparent;border:1px solid var(--rule);border-radius:3px;padding:7px 10px;color:var(--ink);font:inherit;font-size:.95rem}
.search input::placeholder{color:var(--mute)}

.list{list-style:none;margin:10px 0 0;padding:0 0 0 26px}
.row{display:flex;align-items:baseline;gap:10px;border-bottom:1px dashed #5d6b93;padding:3px 0 2px}
.row .name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1.06rem;min-width:0;flex:1;text-align:left}
.row .name span{overflow-wrap:anywhere}
.row .name svg{width:20px;height:20px;flex:none;align-self:center}
.row a.name:hover span,.row button.name:hover span{color:var(--chalk)}
.row .info{font-size:.84rem;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .info.empty{color:var(--mute);font-style:italic}
.row.pdf .name{font-weight:400}
.tag{font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--chalk);color:var(--chalk);border-radius:2px;padding:0 4px;margin-left:4px;white-space:nowrap}
.none{color:var(--mute);font-style:italic;padding:10px 0}

h3.sec{font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin:34px 0 4px}
.recent{padding-left:26px}
.recent .name{font-weight:700}
.recent .info{color:var(--ink)}

@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:18px}
  .side{position:static;order:2}
  main{order:1}
  .list,.recent{padding-left:0}
  .row{flex-wrap:wrap;gap:2px 10px}
  .row .info{margin-left:28px}
}
@media (prefers-reduced-motion:no-preference){
  .row,.slink,.side-icons button{transition:color .12s,background-color .12s}
}
</style>

</head>
<body>
<header class="top">
  <h1>Documents à télécharger – Physique &amp; Chimie <em>MP*</em></h1>
</header>

<div class="wrap">
  <aside class="side" aria-label="Navigation">
    <nav class="side-icons" aria-label="Raccourcis">
      <button id="ic-home" title="Accueil" aria-label="Accueil"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></button>
      <button id="ic-recent" title="Documents récents" aria-label="Documents récents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg></button>
      <button id="ic-folder" title="Tous les dossiers" aria-label="Tous les dossiers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h6l2 2h10v11H3z"/></svg></button>
      <button id="ic-cal" title="Calendrier des devoirs" aria-label="Calendrier des devoirs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2" stroke-linecap="round"/></svg></button>
    </nav>

    <div class="logos">
      <img src="img/logo-lycee.png" alt="Lycée d'Excellence Mohammed VI, Casablanca">
      <img src="img/logo-ar.png" alt="ثانوية محمد السادس للتميز">
    </div>

    <div class="sblock">
      <button class="slink" data-go="general"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h6l2 2h10v11H3z"/></svg>Documents généraux</button>
    </div>
    <div class="sblock">
      <h2>Physique &amp; Chimie</h2>
      <button class="slink on" data-go="root"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h6l2 2h10v11H3z"/></svg>Documents à télécharger</button>
      <button class="slink" data-go="recent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>Documents récents</button>
    </div>
    <div class="sblock" id="cal">
      <h2>À rendre</h2>
      <p class="meta"><b>DM 3</b> – Électronique</p>
      <p class="meta"><b>DL 1</b> – Chimie des solutions</p>
    </div>
    <div class="sblock">
      <p class="meta">Classe <b>MP*</b> · Année <b>2026/2027</b></p>
      <p class="meta">Lycée d'Excellence Mohammed VI – Casablanca</p>
      <p class="meta">Professeur : <b>E. ITTOHO</b></p>
    </div>
  </aside>

  <main>
    <div class="bar">
      <nav class="crumbs" id="crumbs" aria-label="Chemin"></nav>
      <div class="sorts" role="group" aria-label="Trier">
        <button data-sort="az" title="Nom A → Z" aria-label="Trier par nom, A à Z"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4v16M3 17l3 3 3-3"/><text x="13" y="10" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">A</text><text x="13" y="20" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">Z</text></svg></button>
        <button data-sort="za" title="Nom Z → A" aria-label="Trier par nom, Z à A"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4v16M3 17l3 3 3-3"/><text x="13" y="10" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">Z</text><text x="13" y="20" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">A</text></svg></button>
        <button data-sort="new" title="Plus récents d'abord" aria-label="Trier par date, plus récents d'abord"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4v16M3 17l3 3 3-3"/><circle cx="16" cy="12" r="5"/><path d="M16 9.5V12l1.8 1.2"/></svg></button>
        <button data-sort="old" title="Plus anciens d'abord" aria-label="Trier par date, plus anciens d'abord"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 20V4M3 7l3-3 3 3"/><circle cx="16" cy="12" r="5"/><path d="M16 9.5V12l1.8 1.2"/></svg></button>
      </div>
    </div>

    <div class="search">
      <label for="q" class="sr" hidden>Rechercher</label>
      <input id="q" type="search" placeholder="Rechercher un document (ex. « corrigé », « TD4 », « chimie »)" autocomplete="off">
    </div>

    <ul class="list" id="list"></ul>

    <section id="recentSec">
      <h3 class="sec">Documents récents</h3>
      <ul class="list recent" id="recent"></ul>
    </section>
  </main>
</div>

<script>
/* ---- Contenu du site : pour ajouter un document, ajouter une ligne dans "docs" ---- */
const FOLDERS = [
  {id:"algo",   name:"Algorithmes au programme des CPGE"},
  {id:"annales",name:"Annales des concours"},
  {id:"capnum", name:"Capacités numériques"},
  {id:"dl",     name:"Devoirs libres"},
  {id:"dm",     name:"DM"},
  {id:"cours",  name:"Documents de cours MP"},
  {id:"ds",     name:"DS"},
  {id:"fiches", name:"Fiches techniques"},
  {id:"interro",name:"Interrogations de cours"},
  {id:"oraux",  name:"Préparation oraux"},
  {id:"colles", name:"Programmes de colles"},
  {id:"progs",  name:"Programmes MP et MPSI"},
  {id:"mpsi",   name:"Retour cours MPSI"},
  {id:"td",     name:"TD"},
  {id:"tp",     name:"TP"},
];
const GENERAL = {id:"general", name:"Documents généraux"};
const docs = [
  {folder:"dm", title:"DM 3 – Électronique : démodulation de signaux AM", file:"docs/DM3_Electronique.pdf", size:302013, date:"2026-10-09", kind:"énoncé"},
  {folder:"dm", title:"DM 3 – Électronique : corrigé", file:"docs/DM3_Electronique_Corrige.pdf", size:312076, date:"2026-10-09", kind:"corrigé"},
  {folder:"dl", title:"DL 1 – Chimie des solutions : le cuivre en solution aqueuse", file:"docs/DL1_Chimie_des_solutions.pdf", size:195897, date:"2026-10-09", kind:"énoncé"},
  {folder:"dl", title:"DL 1 – Chimie des solutions : corrigé", file:"docs/DL1_Chimie_des_solutions_Corrige.pdf", size:199754, date:"2026-10-09", kind:"corrigé"},
  {folder:"td", title:"TD 4 – Mécanique du solide", file:"docs/TD4_Mecanique_du_solide.pdf", size:1015225, date:"2026-10-09", kind:"énoncé"},
  {folder:"td", title:"TD 4 – Mécanique du solide : corrigé", file:"docs/TD4_Mecanique_du_solide_Corrige.pdf", size:290798, date:"2026-10-09", kind:"corrigé"},
];

const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h6l2 2h10v11H3z"/></svg>';
const ICON_PDF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><path d="M9 17c1.5-1 3-4 3.5-7 .3-1.5-1.2-1.6-1.2 0 0 2.5 3 6 5 6.5 1.4.3 1.4-1.2 0-1.2-2 0-5.5 1-7.3 1.7"/></svg>';

let state = {view:"root", sort:"az", q:""};
try{ const s = localStorage.getItem("pc-sort"); if(s) state.sort = s; }catch(e){}

const fmtSize = b => b >= 1e6 ? (b/1e6).toFixed(1).replace(".",",")+" Mo" : Math.round(b/1e3)+" ko";
const fmtDate = d => { const [y,m,j] = d.split("-"); return j+"/"+m+"/"+y; };
const plural = (n,w) => n+" "+w+(n>1?"s":"");
const absUrl = p => { try{ return new URL(p, document.baseURI).href; }catch(e){ return p; } };
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const folderName = id => id === "general" ? GENERAL.name : (FOLDERS.find(f=>f.id===id)||{}).name || id;
const docsIn = id => docs.filter(d => d.folder === id);
const lastDate = id => docsIn(id).map(d=>d.date).sort().pop() || "0000";

function sortItems(items, isFolder){
  const byName = (a,b) => a.name.localeCompare(b.name,"fr",{sensitivity:"base"});
  const dateOf = x => isFolder ? lastDate(x.id) : x.date;
  const arr = items.slice();
  if(state.sort==="az") arr.sort(byName);
  if(state.sort==="za") arr.sort((a,b)=>-byName(a,b));
  if(state.sort==="new") arr.sort((a,b)=> dateOf(b).localeCompare(dateOf(a)) || byName(a,b));
  if(state.sort==="old") arr.sort((a,b)=> dateOf(a).localeCompare(dateOf(b)) || byName(a,b));
  return arr;
}

function docRow(d, withPath){
  const li = document.createElement("li");
  li.className = "row pdf";
  const a = document.createElement("a");
  a.className = "name"; a.href = absUrl(d.file); a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = ICON_PDF;
  const span = document.createElement("span");
  span.textContent = withPath ? "Physique & Chimie/"+folderName(d.folder)+"/"+d.title : d.title;
  a.appendChild(span);
  if(d.kind === "corrigé"){ const t=document.createElement("span"); t.className="tag"; t.textContent="corrigé"; a.appendChild(t); }
  const info = document.createElement("span");
  info.className = "info";
  info.textContent = "(pdf, "+fmtDate(d.date)+", "+fmtSize(d.size)+")";
  li.append(a, info);
  return li;
}

function folderRow(f){
  const n = docsIn(f.id).length;
  const li = document.createElement("li");
  li.className = "row";
  const b = document.createElement("button");
  b.className = "name"; b.innerHTML = ICON_FOLDER;
  const span = document.createElement("span"); span.textContent = f.name; b.appendChild(span);
  b.addEventListener("click", ()=>go(f.id));
  const info = document.createElement("span");
  info.className = "info" + (n ? "" : " empty");
  info.textContent = n ? "("+plural(n,"document")+")" : "(vide)";
  li.append(b, info);
  return li;
}

function renderCrumbs(){
  const c = document.getElementById("crumbs");
  c.textContent = "";
  const root = document.createElement("button");
  root.innerHTML = ICON_FOLDER + "<span>Physique &amp; Chimie</span>";
  root.addEventListener("click", ()=>go("root"));
  c.appendChild(root);
  if(state.view !== "root"){
    const sep = document.createElement("span"); sep.className="sep"; sep.textContent="›";
    const here = document.createElement("span");
    here.textContent = state.view==="recent" ? "Documents récents" : folderName(state.view);
    c.append(sep, here);
  }
}

function render(){
  renderCrumbs();
  document.querySelectorAll(".sorts button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.sort===state.sort)));
  document.querySelectorAll(".slink").forEach(b=>b.classList.toggle("on", b.dataset.go===state.view));
  const list = document.getElementById("list");
  list.textContent = "";
  const q = norm(state.q.trim());

  if(q){
    const hits = docs.filter(d => norm(d.title+" "+folderName(d.folder)+" "+d.kind).includes(q));
    sortItems(hits.map(d=>({...d,name:d.title})), false).forEach(d=>list.appendChild(docRow(d,true)));
    if(!hits.length){ const p=document.createElement("li"); p.className="none"; p.textContent="Aucun document ne correspond à « "+state.q.trim()+" »."; list.appendChild(p); }
  } else if(state.view === "root"){
    sortItems(FOLDERS, true).forEach(f=>list.appendChild(folderRow(f)));
  } else if(state.view === "recent"){
    recentDocs(20).forEach(d=>list.appendChild(docRow(d,true)));
  } else {
    const items = sortItems(docsIn(state.view).map(d=>({...d,name:d.title})), false);
    items.forEach(d=>list.appendChild(docRow(d,false)));
    if(!items.length){ const p=document.createElement("li"); p.className="none"; p.textContent="Ce dossier ne contient pas encore de document."; list.appendChild(p); }
  }

  const rec = document.getElementById("recent");
  rec.textContent = "";
  recentDocs(6).forEach(d=>rec.appendChild(docRow(d,true)));
  document.getElementById("recentSec").hidden = state.view==="recent" || !!q;
}

function recentDocs(n){
  return docs.slice().sort((a,b)=> b.date.localeCompare(a.date) || docs.indexOf(b)-docs.indexOf(a)).slice(0,n);
}

function go(view){
  state.view = view; state.q = ""; document.getElementById("q").value = "";
  try{ history.replaceState(null,"", view==="root" ? location.pathname+location.search : "#"+view); }catch(e){}
  render();
  window.scrollTo({top:0, behavior:"auto"});
}

document.querySelectorAll(".sorts button").forEach(b=>b.addEventListener("click",()=>{
  state.sort = b.dataset.sort;
  try{ localStorage.setItem("pc-sort", state.sort); }catch(e){}
  render();
}));
document.querySelectorAll(".slink").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));
document.getElementById("ic-home").addEventListener("click",()=>go("root"));
document.getElementById("ic-folder").addEventListener("click",()=>go("root"));
document.getElementById("ic-recent").addEventListener("click",()=>go("recent"));
document.getElementById("ic-cal").addEventListener("click",()=>document.getElementById("cal").scrollIntoView({behavior:"smooth",block:"center"}));
document.getElementById("q").addEventListener("input", e=>{ state.q = e.target.value; render(); });

const h = (location.hash||"").slice(1);
if(h && (h==="recent" || h==="general" || FOLDERS.some(f=>f.id===h))) state.view = h;
render();
</script>

</body>
</html>
